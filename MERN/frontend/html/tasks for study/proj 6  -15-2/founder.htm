<html>

<head></head>

<body>
    <div>
        <form action="">
            <h1>Founder</h1>
            <label for="founder_name">Founder Name: </label>
            <input type="text" name="" id="founder_name">
            <br>
            <label for="phone_num">Phone: </label>
            <input type="text" id="phone_num">
            <br>
            <label for="descript">Descript: </label>
            <textarea name="descript" id="descript"></textarea>
            <br>
            <label for="image">Photo: </label>
            <input type="file" id="image" accept=".jpg; .png">
            <br>
            <label for="cv">Founder CV </label>
            <input type="file" id="cv" name="cv" accept=".pdf">
            <br>
            <label for="student_graduate">Graduate: </label>
            <input type="radio" id="student_graduate" name="student_graduate" value="yes"> yes
            <input type="radio" id="student_graduate" name="student_graduate" value="No"> No
            <br>
            <label for="age"> Age: </label>
            <input type="number" id="age" name="age">
            <br>
            <label for="gender"> Gender: </label>
            <input type="radio" id="Gender" name="Gender" value="male"> Male
            <input type="radio" id="Gender" name="Gender" value="female"> female
            <br>
            <label for="password">Password: </label>
            <input type="password" name="password" id="password">
            <br>
            <a href="index.htm">Back to Home</a>
            <br>
            <button>submit</button>
        </form>
    </div>

</body>

</html>

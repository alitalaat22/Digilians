<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Layouts: Flex vs Grid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="grid-parent">
        <header class="header">
            <nav class="flex-nav">
                <div class="logo">FlexGrid Lab</div>
                <ul class="nav-links">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Projects</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
                <button class="cta-btn">Sign Up</button>
            </nav>
        </header>

        <aside class="sidebar">
            <h3>Menu</h3>
            <ul>
                <li>Dashboard</li>
                <li>Statistics</li>
                <li>Settings</li>
            </ul>
        </aside>

        <main class="content">
            <h2>Flexbox Card Section</h2>
            <div class="flex-container">
                <div class="card card-grow">Flexible Grow</div>
                <div class="card card-fixed">Basis 200px</div>
                <div class="card card-align">Self Align</div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Layout Masterclass</p>
        </footer>
    </div>

</body>

</html>
